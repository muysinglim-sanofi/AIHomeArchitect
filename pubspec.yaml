name: ai_home_architect
description: AI Home Architect Companion — V1
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Network
  dio: ^5.4.3+1

  # Images
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  # Wave 6.15 — compress the source photo before Supabase upload (2.2 MB raw
  # → ~0.6 MB) so the generation starts ~3-4s sooner. Native; handles EXIF.
  flutter_image_compress: ^2.3.0

  # Sharing
  share_plus: ^10.0.0

  # Environment
  flutter_dotenv: ^5.1.0

  # Fonts
  google_fonts: ^6.2.1

  # Voice
  speech_to_text: ^7.3.0

  # Backend
  supabase_flutter: ^2.8.4
  shared_preferences: ^2.3.5

  # Wave 5.17a — Identity Foundation. Apple Sign-In (mandated by App Store
  # Guideline 5.1.1(v) when offering third-party login) + Google Sign-In.
  # Both feed into Supabase Auth's anonymous-user-upgrade flow via
  # `auth.linkIdentity(OAuthProvider.apple/google)` so the existing anon
  # session (and its associated project/messages/images) is preserved
  # across sign-in.
  sign_in_with_apple: ^6.1.4
  google_sign_in: ^6.2.2
  crypto: ^3.0.3   # SHA-256 nonce for Apple Sign-In replay protection

  # Wave 5.17d — RevenueCat purchases SDK (subscriptions, restore,
  # entitlement state). App User ID is bound to the Supabase anonymous
  # UUID ; webhook → backend updates the user_roles.role='premium' row
  # that the quota module consults.
  purchases_flutter: ^8.0.0

  # Utils
  intl: ^0.20.2
  flutter_local_notifications: ^22.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

# Sprint 2A — AYDEN app icon (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  image_path: "assets/branding/app_icon_1024_black.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  # Android masks app icons to the launcher shape (circle/squircle), so the
  # adaptive FOREGROUND must be the logo on TRANSPARENT — a full opaque square
  # here made launchers draw an ugly gold ring. This frame-less, safe-zone-
  # padded logo (gold compass + AYDEN, keyed off the black master) gives a clean
  # black icon with the centred logo. iOS keeps the full square via image_path.
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"

# CHANTIER E (v2) — native launch screen. Light ivory bg + gold compass so the
# OS launch screen MATCHES the new LIGHT architectural Flutter splash (the photo
# scene is light beige — a dark native bg would flash dark→light at handoff).
flutter_native_splash:
  # Pale cream — matches the iOS-rendered launch tone so Android & iOS read the
  # same (was #EDE4D8, which iOS colour-management displayed noticeably lighter).
  color: "#F1EDE6"
  image: assets/branding/ayden_compass_gold.png
  android_12:
    color: "#F1EDE6"
    image: assets/branding/ayden_compass_gold.png
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/splash/
    - assets/showcase/
    - assets/atmospheres/
    - assets/atmospheres/ftue/
    - assets/cards/rooms/
    - assets/cards/atmospheres/
    - assets/examples/
    - assets/branding/

