# AYDEN STUDIO — PWA STAGING backend on Fly.io.
# STAGING ONLY. No production credential belongs in this app's secrets, and the
# launcher refuses to boot against the production Supabase project regardless.

app = "ayden-api-staging"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  # Read by run_pwa_staging.py. The presence of PORT is ALSO what makes the
  # launcher bind 0.0.0.0 instead of loopback — see its comment.
  PORT = "8080"
  APP_ENV = "staging"
  # The validated engine configuration. Launching without it serves a config
  # that was never benched.
  BIMODAL_ENABLED = "1"
  # THE browser origins allowed to make credentialed calls to this API.
  # Everything else is refused at the preflight. Add a host here, redeploy.
  # `aydenstudio.app` / `www.aydenstudio.app` do not resolve (audited
  # 2026-09-03) and are kept only because removing an origin nobody uses is not
  # worth a redeploy on its own. `preprod.aydenstudio.com` is the DEDICATED Web
  # preproduction site (Firebase site `ayden-studio-preprod`), added 2026-09-04:
  # it runs the SAME staging build against this same staging API, and it is the
  # address phone validation now uses.
  PWA_ALLOWED_ORIGINS = "https://ayden-studio.web.app,https://ayden-studio.firebaseapp.com,https://preprod.aydenstudio.com,https://ayden-studio-preprod.web.app,https://aydenstudio.app,https://www.aydenstudio.app"
  # Firebase preview channels get a generated hostname per channel, so a fixed
  # list refuses every review deployment. Narrow on purpose: this project's own
  # preview subdomains, https only, anchored — not a wildcard.
  # TOML LITERAL string (single quotes): a basic "..." string rejects \. as an
  # invalid escape, and the deploy fails at parse time.
  PWA_ALLOWED_ORIGIN_REGEX = '^https://ayden-studio--[a-z0-9-]+\.web\.app$'
  # Where PayWay sends the BROWSER back after a checkout. Navigation only — the
  # server never reads the outcome, and Check Transaction remains the authority.
  PAYWAY_RETURN_BASE_URL = "https://ayden-studio.web.app"
  PAYWAY_ENV = "sandbox"
  # THE UNLOCK OF THIS DEPLOYMENT. PayWay could never reach 127.0.0.1, so the
  # rail ran poll-only: correct, but it learned about a payment when it asked
  # rather than when it was told. A public HTTPS host can finally receive the
  # server-to-server pushback.
  #
  # It changes nothing about AUTHORITY. A pushback is still a doorbell: the
  # callback verifies its signature, then Check Transaction decides, then the
  # Billing Engine grants. Faster, not more trusting.
  PAYWAY_CALLBACK_URL = "https://ayden-api-staging.fly.dev/pwa/staging/payments/payway/callback"
  PAYWAY_VIEW_TYPE = "hosted_view"
  # ABA KHQR, and nothing else — enforced AT THE SOURCE rather than by hiding
  # options in Ayden's UI.
  #
  # `abapay_khqr` again since 2026-09-05 (evening). ABA's website guidance,
  # received the same day, is explicit: "For website integration the
  # payment_option value must be abapay_khqr or cards", and the checkout is to
  # be presented by THEIR JavaScript plugin, which sizes its mobile sheet on
  # exactly the string `abapay_khqr`. The plugin path (`/checkout/plugin`)
  # refuses to sign any other value.
  #
  # The server-side Purchase path (`/checkout`) is dormant but kept. Under this
  # option it would answer as it did before 2026-09-05 morning; the notes below
  # on the two options are retained because they were measured and remain true:
  #
  #   abapay_khqr           HTTP 302, Location only. No first-level fields at
  #                         all — the payload exists solely inside the opaque
  #                         checkout token, and the only way to show a customer
  #                         anything is to embed ABA's hosted page.
  #   abapay_khqr_deeplink  HTTP 200 JSON with `qr_string` (the official EMV
  #                         KHQR payload) and `abapay_deeplink` (the official
  #                         ABA Mobile link) as documented first-level fields.
  #
  # The hosted page was measured at 340 / 360 / 390 / 420 px iframe widths on
  # 2026-09-05 and has NO mobile breakpoint: it renders the same ~1180 px
  # desktop composition at every width, instruction column and postal footer
  # included. It cannot be the compact modal ABA approved without scaling or
  # cropping their page, which is not ours to do. So the modal is built from the
  # two official fields above and ABA's page is not embedded at all.
  #
  # WHY. ABA's merchant review (2026-09-04) asks that KHQR be the only payment
  # method offered. Left empty, this integration sends no `payment_option` at
  # all, and PayWay then draws its OWN chooser — which, decoded from a real
  # sandbox checkout token on 2026-08-19, offers `cards`, `abapay_deeplink`,
  # `abapay_khqr_deeplink` and `abapay_khqr`. Any recette capture taken against
  # that configuration would show a Credit/Debit Card button and contradict the
  # approved deck.
  #
  # ONE CAVEAT, measured 2026-09-05 and worth knowing: under this option the
  # hosted page's own label reads "ABA Pay" rather than "ABA KHQR". The
  # transaction is unchanged (same KHQR payload, same `abapay_khqr_request_qr`
  # step) and no customer is ever sent to that page — but anyone who opened it
  # would read the other name. The token lifetime also halves, 300s -> 180s,
  # which the seam already models as `checkout_stale`.
  #
  # ROLLBACK is this line: delete it and PayWay's own chooser comes back,
  # Credit/Debit Card included.
  PAYWAY_PAYMENT_OPTION = "abapay_khqr"
  PAYWAY_CURRENCY = "USD"

[http_service]
  internal_port = 8080
  # A public staging API is still a public API: no plaintext hop, ever.
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Zero would make the first request of the day wait for a cold boot that
  # imports the whole engine. One machine keeps the phone test honest.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[vm]]
  # A generation holds a request open for ~2 minutes while OpenAI works, and the
  # image pipeline decodes JPEGs in-process. 1 GB is the floor that does not
  # OOM on a 1536x1024 re-encode.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[checks.health]
  type = "http"
  port = 8080
  method = "GET"
  path = "/pwa/staging/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"
