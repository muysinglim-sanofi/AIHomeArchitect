# ─────────────────────────────────────────────────────────────────────────────
# AYDEN Studio — Codemagic CI/CD → iOS TestFlight (no Mac needed)
# This file lives at the ROOT of the Flutter project (branch wave4-design-spine).
#
# ⚙️  BEFORE the first build, configure in the Codemagic UI:
#   1. App Store Connect integration (App Store Connect API key)
#        → rename "AYDEN App Store" below to match YOUR integration name.
#   2. Environment variable GROUP named "ayden_env" (mark values as Secure),
#        containing the 5 .env keys:
#          API_BASE_URL                    = https://ayden-backend.onrender.com
#          SUPABASE_URL                    = https://<your-project>.supabase.co
#          SUPABASE_ANON_KEY               = <your supabase anon key>
#          REVENUECAT_PUBLIC_API_KEY_IOS   = <appl_... or leave empty for now>
#          REVENUECAT_PUBLIC_API_KEY_ANDROID = <goog_... or leave empty>
#   3. Register the bundle id  com.aydenstudio.app  in
#        App Store Connect (create the app there first).
#
# The .env is gitignored on purpose — it is INJECTED here at build time from the
# Codemagic vars (never committed).
# ─────────────────────────────────────────────────────────────────────────────

workflows:
  ios-testflight:
    name: AYDEN — iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: AYDEN App Store      # ← name of YOUR ASC integration in Codemagic
    environment:
      groups:
        - ayden_env                            # the 5 .env vars (Secure, set in Codemagic UI)
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.aydenstudio.app"
    scripts:
      - name: Inject frontend .env (from Codemagic vars — gitignored, written here)
        script: |
          # echo (not heredoc): any YAML indentation sits BEFORE `echo`, never
          # inside the value → the written keys are always flush-left.
          {
            echo "API_BASE_URL=$API_BASE_URL"
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "REVENUECAT_PUBLIC_API_KEY_IOS=$REVENUECAT_PUBLIC_API_KEY_IOS"
            echo "REVENUECAT_PUBLIC_API_KEY_ANDROID=$REVENUECAT_PUBLIC_API_KEY_ANDROID"
          } > "$CM_BUILD_DIR/.env"
          echo "✓ .env written (API_BASE_URL=$API_BASE_URL)"
      - name: Flutter pub get
        script: flutter pub get
      - name: Set up iOS code signing
        script: |
          keychain initialize
          # CERTIFICATE_PRIVATE_KEY (Codemagic Secure env var) is the RSA key the
          # iOS Distribution certificate is built from. With it, --create makes the
          # certificate (first run) + reuses it, plus the App Store provisioning
          # profile for $BUNDLE_ID. Without it the CLI errors:
          # "Cannot create resource without certificate private key".
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Flutter build IPA
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # beta_groups:                # uncomment + set your TestFlight group to auto-assign testers
        #   - Internal Testers

  # ───────────────────────────────────────────────────────────────────────────
  # FT2-B Identity Spike — SEPARATE workflow (branch spike/ft2b-apple-identity-link).
  # Builds the ISOLATED spike entrypoint (lib/main_ft2b_spike.dart) under the
  # DISTINCT bundle id com.aydenstudio.app.ft2bspike, so it coexists with the
  # normal Ayden app. It writes ONLY the 3 Supabase/API keys the spike needs
  # (no RevenueCat / Firebase / Push). The ios-testflight workflow above is left
  # BYTE-UNCHANGED. Run this workflow MANUALLY, only from the spike branch.
  #
  # Prerequisites (FT2-B1 — done in Apple / Supabase consoles, NOT here):
  #   • explicit App ID com.aydenstudio.app.ft2bspike with Sign in with Apple,
  #     GROUPED under the primary com.aydenstudio.app App ID;
  #   • a matching App Store Connect app record;
  #   • Supabase Apple provider Client IDs incl. com.aydenstudio.app.ft2bspike;
  #   • Supabase Manual Linking enabled.
  # ───────────────────────────────────────────────────────────────────────────
  ios-ft2b-spike:
    name: AYDEN — FT2B Identity Spike
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: AYDEN App Store      # reuse the existing ASC integration
    environment:
      groups:
        - ayden_env                            # reuse the group; only 3 keys are written below
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.aydenstudio.app.ft2bspike"
    scripts:
      - name: Inject spike .env (Supabase + API only — no RevenueCat/Push)
        script: |
          {
            echo "API_BASE_URL=$API_BASE_URL"
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          } > "$CM_BUILD_DIR/.env"
          echo "✓ spike .env written (API_BASE_URL=$API_BASE_URL)"
      - name: Flutter pub get
        script: flutter pub get
      - name: Set up iOS code signing (spike bundle id)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Flutter build IPA (spike entrypoint)
        script: |
          flutter build ipa --release \
            -t lib/main_ft2b_spike.dart \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true          # internal testers only; no external beta_groups
